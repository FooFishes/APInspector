name: 功能建议
description: 提出一个新功能或改进
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        提交前请看一下 docs/PRD.md 第 9 节，那里列出了当前版本有意不做的功能。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 你在什么场景下遇到了什么不便。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
      description: 你希望应用怎样处理这个场景。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他做法
  - type: checkboxes
    id: contribute
    attributes:
      label: 参与实现
      options:
        - label: 我愿意为此提交 Pull Request
