openapi: 3.0.3
info:
  title: Petstore
  version: 1.0
  description: 用于测试的宠物商店。
servers:
  - url: https://{region}.petstore.example/v1
    description: 生产环境
    variables:
      region:
        default: eu
        enum: [eu, us]
  - url: http://localhost:8080/v1
tags:
  - name: pets
    description: 宠物
  - name: store
security:
  - bearerAuth: []
paths:
  /pets:
    get:
      tags: [pets]
      summary: 列出宠物
      operationId: listPets
      parameters:
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            type: string
            enum: [available, sold]
      responses:
        200:
          description: 宠物列表
          headers:
            X-Total-Count:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [pets]
      summary: 新增宠物
      requestBody:
        $ref: '#/components/requestBodies/NewPet'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
  /pets/{petId}:
    summary: 单个宠物
    parameters:
      - name: petId
        in: path
        description: 宠物 ID
        schema:
          type: integer
          format: int64
    get:
      tags: [pets]
      summary: 查看宠物
      responses:
        '200':
          description: 宠物
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
    delete:
      tags: [pets]
      summary: 删除宠物
      deprecated: true
      security:
        - apiKeyAuth: []
      responses:
        '204':
          description: 已删除
  /health:
    get:
      summary: 健康检查
      security: []
      responses:
        '200':
          description: 正常
components:
  parameters:
    Limit:
      name: limit
      in: query
      description: 返回的最大条数
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  requestBodies:
    NewPet:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NewPet'
          example:
            name: 旺财
  responses:
    Error:
      description: 错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    NewPet:
      type: object
      required: [name]
      properties:
        name:
          type: string
        tag:
          type: string
          nullable: true
    Pet:
      allOf:
        - $ref: '#/components/schemas/NewPet'
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
              readOnly: true
    Error:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
    Unused:
      type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: Bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      name: X-API-Key
      in: header
